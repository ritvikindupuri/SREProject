apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-sentinel-zero-trust
  annotations:
    policies.kyverno.io/title: "Enforce Pod Security Standards (Zero-Trust)"
    policies.kyverno.io/category: "Pod Security Standards (Restricted)"
    policies.kyverno.io/severity: "High"
    policies.kyverno.io/description: "Requires containers to run as non-root, drop all capabilities, use read-only root filesystems, and apply seccomp RuntimeDefault profile."
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-non-root
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Running as root is forbidden under SentinelMesh Zero-Trust policy."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true

    - name: require-drop-all-capabilities
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Containers must drop ALL Linux capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

    - name: require-seccomp-runtime-default-mesh
      match:
        any:
        - resources:
            kinds:
              - Pod
            selector:
              matchLabels:
                sentinel.mesh/service: "*"
      validate:
        message: "Service mesh pods must use seccomp RuntimeDefault profile."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault

    - name: require-readonly-rootfs-mesh
      match:
        any:
        - resources:
            kinds:
              - Pod
            selector:
              matchLabels:
                sentinel.mesh/service: "*"
      validate:
        message: "Service mesh containers must use read-only root filesystem."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
