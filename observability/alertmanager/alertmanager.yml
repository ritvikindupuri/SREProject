global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'coreops-autonomous-operator'

receivers:
  - name: 'coreops-autonomous-operator'
    webhook_configs:
      - url: 'http://coreops-operator:8088/api/v1/sre-alerts'
        send_resolved: true
        max_alerts: 10
